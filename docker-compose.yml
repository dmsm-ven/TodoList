name: todo

services:
  api:
    image: painven/todo_api:latest
    container_name: todo_api
    restart: unless-stopped
    env_file: "api.env"
    ports:
      - "8090:80"
    environment:
      ASPNETCORE_URLS: http://+:80
    networks:
    - todo_network

  db:
    image: postgres:18
    container_name: todo_database
    restart: always
    env_file: "db.env"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - todo_network


networks:  
  todo_network:
    name: todo_network

volumes:
  pgdata:
    name: pgdata_todo