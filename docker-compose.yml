name: todo

services:
  api:
    image: painven/todo_api:latest
    container_name: todo_api
    restart: unless-stopped
    env_file: "api.env"
    ports:
      - "8090:80"
    environment:
      ASPNETCORE_URLS: http://+:80
    networks:
    - todo_network

  db:
    image: postgres:18
    container_name: todo_database
    restart: always
    env_file: "db.env"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - todo_network

  webui:
    image: painven/todo_web:latest
    container_name: todo_web
    restart: unless-stopped
    env_file: "web.env"
    ports:
      - "8070:80"
    networks:
    - todo_network
    environment:
      ASPNETCORE_URLS: http://+:80
      ApiConfiguration__Host: "http://api:80"
    depends_on:
      - api

networks:  
  todo_network:
    name: todo_network

volumes:
  pgdata:
    name: pgdata_todo